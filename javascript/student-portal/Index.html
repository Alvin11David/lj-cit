<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CiT Student Grade Portal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <header class="top-bar">
      <h1>CiT Student Grade Portal</h1>
    </header>

    <main class="main-content">

      <!-- ======= Add Student Form ======= -->
      <section class="form-section">
        <h2>Add New Student</h2>

        <form id="addForm" class="student-form">
          <input id="name" type="text" placeholder="Full name" required />
          <input id="reg" type="text" placeholder="Reg number" required />
          <input id="gpa" type="number" step="0.01" min="0" max="4" placeholder="GPA" required />
          <button type="submit">Add Student</button>
        </form>
      </section>

      <!-- ======= Student List ======= -->
      <section class="list-section">
        <h2>Student List</h2>
        <ul id="studentList" class="student-list"></ul>
      </section>

    </main>

    <!-- ======= Edit Modal ======= -->
    <div id="editModal" class="modal hide">
      <div class="modal-box">
        <h2>Edit Student</h2>
        <form id="editForm" class="student-form">
          <input id="editName" type="text" placeholder="Full name" required />
          <input id="editReg" type="text" placeholder="Reg number" required />
          <input id="editGpa" type="number" step="0.01" min="0" max="4" placeholder="GPA" required />
          <div class="modal-btns">
            <button type="submit">Save Changes</button>
            <button type="button" id="cancelEdit">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
