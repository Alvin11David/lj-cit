<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 7 - Fetch and APIs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ======= Country Lookup Section ======= -->
    <section class="page-section">
      <div class="section-box">
        <h1>Country Lookup</h1>
        <p class="section-label">Week 7 Exercise 1</p>

        <div class="search-bar">
          <input id="countryInput" type="text" placeholder="Type a country name..." />
          <button id="searchBtn">Search</button>
        </div>

        <p id="countryStatus" class="msg-text"></p>

        <div id="countryResult" class="result-box hide">
          <span id="countryFlag" class="flag-text"></span>
          <h2 id="countryName"></h2>
          <div class="info-line">
            <span class="info-label">Capital</span>
            <span id="countryCapital" class="info-value"></span>
          </div>
          <div class="info-line">
            <span class="info-label">Region</span>
            <span id="countryRegion" class="info-value"></span>
          </div>
          <div class="info-line">
            <span class="info-label">Population</span>
            <span id="countryPop" class="info-value"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ======= CiT Directory Section ======= -->
    <section class="page-section grey-bg">
      <div class="section-box">
        <h1>CiT Directory</h1>
        <p class="section-label">Week 7 Homework 2</p>

        <p id="directoryStatus" class="msg-text"></p>

        <div id="userCards" class="cards-row"></div>
      </div>
    </section>

    <script src="script.js" defer></script>
  </body>
</html>
