<main class="app-shell">
	<header class="app-header">
		<div class="brand">
			<span class="brand-mark">CiT</span>
			<div class="brand-text">
				<h1>{{ title() }}</h1>
				<p class="tagline">Student Grade Portal · Angular 21 · Weeks 13 &amp; 14</p>
			</div>
		</div>

		<nav class="nav-bar">
			<a routerLink="/students" routerLinkActive="active" class="nav-link">
				Students
			</a>
			<a routerLink="/about" routerLinkActive="active" class="nav-link">
				About
			</a>
			<a routerLink="/unknown-route" class="nav-link nav-link-muted">
				Trigger 404
			</a>
		</nav>

		<div class="control-panel">
			<div class="control-group">
				<span class="control-title">Route guard</span>
				<div class="control-actions">
					<button type="button" class="action-button" (click)="grantAboutAccess()">
						Grant
					</button>
					<button type="button" class="action-button ghost" (click)="revokeAboutAccess()">
						Revoke
					</button>
					<span class="chip" [class.on]="hasAboutAccess()">
						{{ hasAboutAccess() ? 'enabled' : 'blocked' }}
					</span>
				</div>
			</div>

			<div class="control-group">
				<span class="control-title">JWT interceptor</span>
				<div class="control-actions">
					<button type="button" class="action-button" (click)="grantToken()">
						Set JWT
					</button>
					<button type="button" class="action-button ghost" (click)="revokeToken()">
						Clear
					</button>
					<span class="chip" [class.on]="hasToken()">
						{{ hasToken() ? 'attached' : 'none' }}
					</span>
				</div>
			</div>
		</div>
	</header>

	<section class="view">
		<router-outlet></router-outlet>
	</section>
</main>
