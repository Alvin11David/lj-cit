<div class="p-6 max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-4">Students</h1>

  @if (isLoading()) {
    <p class="text-gray-500">Loading students…</p>
  } @else {
    <div class="space-y-2">
      @for (s of students; track s.regNumber) {
        <app-student-card
          [student]="s"
          (select)="onSelect($event)"
        ></app-student-card>
      } @empty {
        <p>No students yet.</p>
      }
    </div>
  }
</div>
