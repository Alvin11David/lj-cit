<div class="p-6 max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-4">Students</h1>

  @if (isLoading()) {
    <p class="text-gray-500">Loading students…</p>
  } @else {
    <ul class="space-y-2">
      @for (s of students; track s.regNumber) {
        <li
          class="p-3 bg-white rounded shadow cursor-pointer hover:bg-gray-100"
          (click)="select(s)"
        >
          {{ s.name }} — GPA {{ s.gpa }}
        </li>
      } @empty {
        <li>No students yet.</li>
      }
    </ul>
  }
</div>
