<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CiT Student Grade Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cit: { navy: "#1B4F72", blue: "#2E86C1" },
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-800">
    <header class="bg-cit-navy text-white shadow-md">
      <div class="max-w-5xl mx-auto flex items-center justify-between px-4 sm:px-6 py-4">
        <h1 class="text-xl md:text-2xl font-bold">CiT Student Grade Portal</h1>
        <span class="hidden sm:inline-block text-sm font-medium bg-white/10 rounded-full px-3 py-1"
          >Week 10 · Tailwind</span
        >
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
      <!-- Add Student Form -->
      <section class="bg-white rounded-lg shadow p-6 mb-10">
        <h2 class="text-lg md:text-xl font-bold text-cit-navy mb-4">Add New Student</h2>
        <form id="addForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input
            id="name"
            type="text"
            placeholder="Full Name"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-cit-blue focus:border-cit-blue transition"
          />
          <input
            id="course"
            type="text"
            placeholder="Course"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-cit-blue focus:border-cit-blue transition"
          />
          <input
            id="marks"
            type="number"
            step="0.1"
            placeholder="Marks e.g. 85.5"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-cit-blue focus:border-cit-blue transition"
          />
          <button
            type="submit"
            class="md:col-span-3 mt-1 w-full md:w-auto justify-self-stretch md:justify-self-end bg-cit-blue hover:bg-cit-navy text-white font-medium px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cit-blue transition"
          >
            Add Student
          </button>
        </form>
      </section>

      <!-- Student List -->
      <section>
        <div class="flex items-center justify-between gap-4 mb-4">
          <h2 class="text-lg md:text-xl font-bold text-cit-navy">All Students</h2>
          <p id="status" class="text-sm text-gray-500 text-right"></p>
        </div>
        <ul
          id="studentList"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        ></ul>
      </section>
    </main>

    <footer class="text-center text-xs text-gray-400 pb-6">
      CiT Frontend Engineering Track — Phase 2
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
