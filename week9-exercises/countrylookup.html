<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Lookup</title>
    <link rel="stylesheet" href="countrylookup.css" />
  </head>
  <body>
    <h1>Country Lookup</h1>
    <input type="text" id="countryInput" placeholder="Enter a country name" />
    <button id="searchBtn">Search</button>
    <p id="countryStatus"></p>
    <div id="countryResult" class="hide">
      <p>Capital: <span id="countryCapital"></span></p>
      <p>Region: <span id="countryRegion"></span></p>
      <p>Population: <span id="countryPop"></span></p>
    </div>

    <script src="dist/countrylookup.js"></script>
  </body>
</html>
